# Runs the published images from ghcr.io instead of building locally.
#
#   cp .env.example .env        # set POSTGRES_PASSWORD and DATABASE_URL
#   export OPS_IMAGE_TAG=v1.0.0
#   docker compose -f docker-compose.release.yml pull
#   docker compose -f docker-compose.release.yml up -d
#
# The backend applies its migrations on start, so upgrading is: change the tag,
# pull, up. Existing data is migrated forward, never recreated.

x-backend-env: &backend-env
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set, see .env.example}
  UPLOADS_DIR: ${UPLOADS_DIR:-/app/uploads}
  APP_ENV: ${APP_ENV:-production}
  APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Berlin}
  APP_BRANCH_DEFAULT: ${APP_BRANCH_DEFAULT:-Remscheid}
  CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:?CORS_ALLOW_ORIGINS must list the frontend origin}
  AUTH_MODE: ${AUTH_MODE:-dev}
  AUTH_DEV_DEFAULT_USER_ID: ${AUTH_DEV_DEFAULT_USER_ID:-}
  AUTH_PASSWORD_LOGIN_ENABLED: ${AUTH_PASSWORD_LOGIN_ENABLED:-true}
  AUTH_SESSION_SECRET: ${AUTH_SESSION_SECRET:-}
  AUTH_SESSION_HOURS: ${AUTH_SESSION_HOURS:-12}
  ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@ops.local}
  ADMIN_DISPLAY_NAME: ${ADMIN_DISPLAY_NAME:-Administrator}
  ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-BSchmitt-Ops-2026!}
  AZURE_TENANT_ID: ${AZURE_TENANT_ID:-}
  AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-}
  AZURE_API_AUDIENCE: ${AZURE_API_AUDIENCE:-}
  AZURE_ROLE_MAP: ${AZURE_ROLE_MAP:-}
  AZURE_AUTO_PROVISION_USERS: ${AZURE_AUTO_PROVISION_USERS:-true}
  AZURE_DEFAULT_ROLE_NAME: ${AZURE_DEFAULT_ROLE_NAME:-}
  UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-26214400}
  WORKER_INTERVAL_SECONDS: ${WORKER_INTERVAL_SECONDS:-900}
  HERMES_API_BASE_URL: ${HERMES_API_BASE_URL:-}
  HERMES_API_KEY: ${HERMES_API_KEY:-}
  HERMES_AGENT_MODEL: ${HERMES_AGENT_MODEL:-hermes-agent}

services:
  ops-frontend:
    image: ghcr.io/${OPS_IMAGE_OWNER:-markusjung60389}/niederlassung-ops-frontend:${OPS_IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      API_BASE_URL: ${PUBLIC_API_BASE_URL:?PUBLIC_API_BASE_URL must point at the backend}
      AUTH_MODE: ${AUTH_MODE:-dev}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:-}
      AZURE_CLIENT_ID: ${AZURE_FRONTEND_CLIENT_ID:-}
      AZURE_API_SCOPE: ${AZURE_API_SCOPE:-}
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      ops-backend:
        condition: service_healthy

  ops-backend:
    image: ghcr.io/${OPS_IMAGE_OWNER:-markusjung60389}/niederlassung-ops-backend:${OPS_IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment: *backend-env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-remscheid_ops}
      POSTGRES_USER: ${POSTGRES_USER:-remscheid_ops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    image: ghcr.io/${OPS_IMAGE_OWNER:-markusjung60389}/niederlassung-ops-backend:${OPS_IMAGE_TAG:-latest}
    command: ["python", "-m", "app.worker"]
    restart: unless-stopped
    environment: *backend-env
    depends_on:
      ops-backend:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads

volumes:
  postgres_data:
  uploads_data:
