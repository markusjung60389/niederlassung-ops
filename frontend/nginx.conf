server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # nginx only inherits add_header from the server level into a location
    # that declares none of its own; every location below sets its own
    # Cache-Control, so the security headers are included in each one instead
    # of being declared once here, or they would silently stop applying.
    # security-headers.conf is written by docker-entrypoint.sh (it needs
    # API_BASE_URL and AUTH_MODE for the CSP's connect-src), same as
    # config.js is written for the app itself.

    # Runtime configuration must never be cached, or a redeploy keeps serving
    # the previous environment's settings.
    location = /config.js {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Hashed assets are immutable.
    location /assets/ {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Single page app: unknown paths fall back to index.html.
    location / {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
