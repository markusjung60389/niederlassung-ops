x-backend-env: &backend-env
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set, see .env.example}
  UPLOADS_DIR: ${UPLOADS_DIR:-/app/uploads}
  APP_ENV: ${APP_ENV:-development}
  APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Berlin}
  APP_BRANCH_DEFAULT: ${APP_BRANCH_DEFAULT:-Remscheid}
  CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
  AUTH_MODE: ${AUTH_MODE:-dev}
  AUTH_DEV_DEFAULT_USER_ID: ${AUTH_DEV_DEFAULT_USER_ID:-}
  AUTH_PASSWORD_LOGIN_ENABLED: ${AUTH_PASSWORD_LOGIN_ENABLED:-true}
  AUTH_SESSION_SECRET: ${AUTH_SESSION_SECRET:-}
  AUTH_SESSION_HOURS: ${AUTH_SESSION_HOURS:-12}
  ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@ops.local}
  ADMIN_DISPLAY_NAME: ${ADMIN_DISPLAY_NAME:-Administrator}
  ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-BSchmitt-Ops-2026!}
  AZURE_SALARY_AUTH_CONTEXT: ${AZURE_SALARY_AUTH_CONTEXT:-c1}
  SALARY_STEP_UP_MAX_AGE_SECONDS: ${SALARY_STEP_UP_MAX_AGE_SECONDS:-900}
  AZURE_TENANT_ID: ${AZURE_TENANT_ID:-}
  AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-}
  AZURE_API_AUDIENCE: ${AZURE_API_AUDIENCE:-}
  AZURE_ROLE_MAP: ${AZURE_ROLE_MAP:-}
  AZURE_AUTO_PROVISION_USERS: ${AZURE_AUTO_PROVISION_USERS:-true}
  AZURE_DEFAULT_ROLE_NAME: ${AZURE_DEFAULT_ROLE_NAME:-}
  UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-26214400}
  WORKER_INTERVAL_SECONDS: ${WORKER_INTERVAL_SECONDS:-900}
  HERMES_API_BASE_URL: ${HERMES_API_BASE_URL:-}
  HERMES_API_KEY: ${HERMES_API_KEY:-}
  HERMES_AGENT_MODEL: ${HERMES_AGENT_MODEL:-hermes-agent}

services:
  ops-frontend:
    build:
      context: ./frontend
    # Applied at container start by the entrypoint, not baked into the image.
    environment:
      API_BASE_URL: ${PUBLIC_API_BASE_URL:-http://localhost:8000}
      AUTH_MODE: ${AUTH_MODE:-dev}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:-}
      AZURE_CLIENT_ID: ${AZURE_FRONTEND_CLIENT_ID:-}
      AZURE_API_SCOPE: ${AZURE_API_SCOPE:-}
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      ops-backend:
        condition: service_healthy

  ops-backend:
    build:
      context: ./backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment: *backend-env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-remscheid_ops}
      POSTGRES_USER: ${POSTGRES_USER:-remscheid_ops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    # No host port mapping: the database holds personal data and is only reached
    # over the compose network. Use `docker compose exec db psql` for a shell.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Rolls recurring compliance records over and keeps action escalation levels
  # in step with how long they are overdue.
  worker:
    build:
      context: ./backend
    command: ["python", "-m", "app.worker"]
    restart: unless-stopped
    environment: *backend-env
    depends_on:
      ops-backend:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads

volumes:
  postgres_data:
  uploads_data:
