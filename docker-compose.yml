x-backend-env: &backend-env
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set, see .env.example}
  UPLOADS_DIR: ${UPLOADS_DIR:-/app/uploads}
  APP_ENV: ${APP_ENV:-development}
  APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Berlin}
  APP_BRANCH_DEFAULT: ${APP_BRANCH_DEFAULT:-Remscheid}
  CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
  AUTH_MODE: ${AUTH_MODE:-dev}
  AUTH_DEV_DEFAULT_USER_ID: ${AUTH_DEV_DEFAULT_USER_ID:-}
  AZURE_TENANT_ID: ${AZURE_TENANT_ID:-}
  AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-}
  AZURE_API_AUDIENCE: ${AZURE_API_AUDIENCE:-}
  AZURE_ROLE_MAP: ${AZURE_ROLE_MAP:-}
  AZURE_AUTO_PROVISION_USERS: ${AZURE_AUTO_PROVISION_USERS:-true}
  AZURE_DEFAULT_ROLE_NAME: ${AZURE_DEFAULT_ROLE_NAME:-}
  HERMES_API_BASE_URL: ${HERMES_API_BASE_URL:-}
  HERMES_API_KEY: ${HERMES_API_KEY:-}
  HERMES_AGENT_MODEL: ${HERMES_AGENT_MODEL:-hermes-agent}

services:
  ops-frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${PUBLIC_API_BASE_URL:-http://localhost:8000}
        VITE_AUTH_MODE: ${AUTH_MODE:-dev}
        VITE_AZURE_TENANT_ID: ${AZURE_TENANT_ID:-}
        VITE_AZURE_CLIENT_ID: ${AZURE_FRONTEND_CLIENT_ID:-}
        VITE_AZURE_API_SCOPE: ${AZURE_API_SCOPE:-}
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      ops-backend:
        condition: service_healthy

  ops-backend:
    build:
      context: ./backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment: *backend-env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-remscheid_ops}
      POSTGRES_USER: ${POSTGRES_USER:-remscheid_ops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    # No host port mapping: the database holds personal data and is only reached
    # over the compose network. Use `docker compose exec db psql` for a shell.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Placeholder for the recurrence and reminder jobs; it does not do any work yet.
  worker:
    build:
      context: ./backend
    command: ["python", "-c", "import time; print('worker ready'); time.sleep(31536000)"]
    environment: *backend-env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads

volumes:
  postgres_data:
  uploads_data:
